<h1>Signal Forms</h1>

<form>
  <div>
    <label>
      Firstname
      <input type="text" [field]="myForm.firstname" />
    </label>
  </div>

  <div>
    <label>
      Lastname
      <input type="text" [field]="myForm.lastname" />
    </label>
  </div>
</form>

<div>
  MODEL:
  <pre>{{ formModel() | json }}</pre>
</div>

<div>
  FORM:
  <pre>{{ myForm().value() | json }}</pre>
</div>
